<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>CorMed Entwurf</title>
<style>
:root{--bg:#f3f6f7;--ink:#0d2329;--mute:#4a6168;--line:#d3dee1;--acc:#0a5260}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px;box-shadow:0 20px 50px -30px rgba(13,35,41,.35)}
b{display:block;font-size:26px;letter-spacing:-.02em;margin-bottom:6px}p{margin:0 0 20px;color:var(--mute)}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;min-height:46px}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
button{margin-top:14px;width:100%;min-height:46px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:600 16px system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6}.err{color:#b4261e;font-size:14px;margin-top:10px;min-height:20px}
</style></head><body>
<form id="f"><b>CorMed</b><p>Entwurf der neuen Website. Bitte geben Sie das Passwort ein, das Sie von Ricki bekommen haben.</p>
<label for="pw">Passwort</label><input id="pw" type="password" autocomplete="current-password" required autofocus>
<button id="b" type="submit">Öffnen</button><div class="err" id="e" role="alert"></div></form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const toHex=a=>[...new Uint8Array(a)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function derive(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:hex(D.salt),iterations:D.iter,hash:'SHA-256'},k,512));}
async function open(dk){
 const ct=b64(D.ct),iv=hex(D.iv);
 const mk=await crypto.subtle.importKey('raw',dk.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);
 const data=new Uint8Array(iv.length+ct.length);data.set(iv);data.set(ct,iv.length);
 if(!await crypto.subtle.verify('HMAC',mk,hex(D.mac),data)) return false;
 const ek=await crypto.subtle.importKey('raw',dk.slice(0,32),'AES-CBC',false,['decrypt']);
 const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv},ek,ct));
 if(document.readyState!=='complete') await new Promise(r=>addEventListener('load',r,{once:true}));
 await new Promise(r=>setTimeout(r,0));
 document.open();document.write(html);document.close();return true;}

 try{const dk=await derive(document.getElementById('pw').value);
