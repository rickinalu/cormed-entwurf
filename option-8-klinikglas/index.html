const hex=s=>new Uint8Array(s.match(/../g).map(h=>parseInt(h,16)));
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const toHex=a=>[...new Uint8Array(a)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function derive(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:hex(D.salt),iterations:D.iter,hash:'SHA-256'},k,512));}
async function open(dk){
 const ct=b64(D.ct),iv=hex(D.iv);
 const mk=await crypto.subtle.importKey('raw',dk.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);
 const data=new Uint8Array(iv.length+ct.length);data.set(iv);data.set(ct,iv.length);
 if(!await crypto.subtle.verify('HMAC',mk,hex(D.mac),data)) return false;
 const ek=await crypto.subtle.importKey('raw',dk.slice(0,32),'AES-CBC',false,['decrypt']);
 const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv},ek,ct));
 if(document.readyState!=='complete') await new Promise(r=>addEventListener('load',r,{once:true}));
 await new Promise(r=>setTimeout(r,0));
 document.open();document.write(html);document.close();return true;}
(async()=>{let s=null;try{s=localStorage.getItem('cormed-key')}catch(e){}
 if(s){try{if(await open(hex(s)))return}catch(e){}}})();
document.getElementById('f').addEventListener('submit',async ev=>{ev.preventDefault();
 const b=document.getElementById('b'),e=document.getElementById('e');b.disabled=true;b.textContent='Wird geöffnet …';e.textContent='';
 try{const dk=await derive(document.getElementById('pw').value);
  try{localStorage.setItem('cormed-key',toHex(dk))}catch(x){}
  if(!await open(dk)){try{localStorage.removeItem('cormed-key')}catch(x){}e.textContent='Das Passwort stimmt nicht.';b.disabled=false;b.textContent='Öffnen';}
 }catch(x){e.textContent='Ihr Browser unterstützt die Entschlüsselung nicht.';b.disabled=false;b.textContent='Öffnen';}});
